services:
  - type: web
    name: bluemarinefatture
    runtime: node
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: bluemarinefatture-db
          property: connectionString

databases:
  - name: bluemarinefatture-db